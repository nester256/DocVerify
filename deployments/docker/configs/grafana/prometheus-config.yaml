global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["gateway:8001"]

  - job_name: "worker"
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["worker:9000"]